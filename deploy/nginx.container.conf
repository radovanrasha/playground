# nginx config INSIDE the frontend container (copied in by the Dockerfile).
# Serves the CRA build and falls back to index.html so client-side routes
# like /battleship-multiplayer/<id> work on refresh.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed build assets never change, so cache them for a long time.
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        # index.html must always be fresh so new deploys are picked up.
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
